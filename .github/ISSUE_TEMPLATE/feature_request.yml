name: Feature request
description: Suggest an improvement to the example providers.
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. CLI, validation-contract, and registry changes
        belong in NVIDIA/ai-cloud-validation. Keep real provider implementations in
        their own repositories.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed improvement
      description: Describe the affected provider, configuration, or script and any alternatives considered.
    validations:
      required: true
  - type: checkboxes
    id: conduct
    attributes:
      label: Community guidelines
      options:
        - label: I have read and agree to follow this repository's CODE_OF_CONDUCT.md.
          required: true
